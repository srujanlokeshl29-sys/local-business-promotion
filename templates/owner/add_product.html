{% extends "base.html" %}

{% block title %}Add Product / Service | LocalBiz{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('owner_dashboard') }}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('owner_products') }}">Products</a></li>
                    <li class="breadcrumb-item active">Add Product</li>
                </ol>
            </nav>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-primary text-white p-4 rounded-top-4">
                    <h4 class="fw-bold mb-1"><i class="bi bi-box-seam me-2"></i> Add Product or Service</h4>
                    <p class="text-white-50 mb-0">Products listed here enable local customers to discover and compare prices.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('owner_add_product') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Target Business *</label>
                            <select name="business_id" class="form-select" required>
                                {% for b in businesses %}
                                    <option value="{{ b.id }}">{{ b.business_name }} ({{ b.city }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product / Item Name *</label>
                            <input type="text" name="product_name" class="form-control" placeholder="e.g. Sona Masoori Rice, Fast Charger, Pure Cotton Shirt" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Price (₹ INR) *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Unit *</label>
                                <input type="text" name="unit" class="form-control" placeholder="e.g. piece, kg, plate, bag, session" value="piece" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Product Image URL (Optional)</label>
                            <input type="url" name="image_url" class="form-control" placeholder="https://images.unsplash.com/...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Short Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Specify brand, ingredients, warranty, dimensions, or special features..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="{{ url_for('owner_products') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                                <i class="bi bi-plus-circle me-1"></i> Add to Catalog
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
