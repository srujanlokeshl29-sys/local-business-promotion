{% extends "base.html" %}

{% block title %}Login | LocalBiz{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="auth-card shadow-sm border-0 rounded-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🏪</span>
                    <h2 class="fw-bold text-primary mt-2">Welcome Back!</h2>
                    <p class="subtitle text-muted">Sign in to your LocalBiz account</p>
                </div>

                <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-semibold text-muted">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <p class="text-center small text-muted mb-4">
                    Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Create Account</a>
                </p>

                <!-- DEMO ACCOUNTS HELPER PILL -->
                <div class="p-3 bg-light rounded-3 border">
                    <small class="fw-bold text-dark d-block mb-1"><i class="bi bi-info-circle-fill text-primary me-1"></i> One-Click Demo Credentials:</small>
                    <div class="d-flex flex-wrap gap-1 mt-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="setDemo('admin@localbiz.com', 'Admin@123')">
                            Admin Demo
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="setDemo('owner@localbiz.com', 'Owner@123')">
                            Owner Demo
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="setDemo('customer@localbiz.com', 'Customer@123')">
                            Customer Demo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setDemo(email, pwd) {
    document.querySelector('input[name="email"]').value = email;
    document.querySelector('input[name="password"]').value = pwd;
}
</script>
{% endblock %}
